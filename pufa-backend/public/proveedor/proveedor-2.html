<!doctype html>
<html lang="es">
  <head>
    <script src='/route-guard.js'></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PUFAB - Proveedor | Portafolio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="portal-page">
    <header class="gov-header">
      <div class="container gov-header-inner">
        <img src="https://www.figma.com/api/mcp/asset/55d910c5-1bcc-479c-acd9-c78a28860e9b" alt="GOV.CO" class="gov-logo" />
        <nav class="gov-links"><a href="https://www.gov.co/" target="_blank" rel="noreferrer">GOV.CO</a><a href="#">Ministerio de Cultura</a><a href="#">Proimágenes</a></nav>
      </div>
      <div class="flag-strip"></div>
    </header>

    <nav class="site-nav">
      <div class="container site-nav-inner">
        <a href="/" class="brand"><span class="brand-icon">◧</span><span>PUFAB</span></a>
        <button class="menu-toggle" aria-label="Abrir menú" id="menuToggle">☰</button>
        <div class="nav-links" id="navLinks">
          <a href="/">Inicio</a>
          <a href="/directorio/">Directorio</a>
          <a href="/tramites/">Trámites</a>
          <a href="/contacto/">Contacto</a>
          <a href="/proveedor/" class="active">Proveedor</a>
        </div>
        <div class="portal-user">Proveedor</div>
      </div>
    </nav>

    <main class="portal-shell container">
      <aside class="portal-sidebar">
        <h2>Mi Perfil Profesional</h2>
        <a class="portal-link" href="/proveedor/">Mi Panel</a>
        <a class="portal-link active" href="/proveedor/proveedor-2.html">Portafolio</a>
        <a class="portal-link" href="/proveedor/proveedor-3.html">Disponibilidad</a>
        <a class="portal-link" href="/proveedor/proveedor-4.html">Solicitudes</a>
        <a class="portal-link" href="/proveedor/proveedor-5.html">Mensajes</a>
      </aside>

      <section class="portal-content" id="portafolioContent">Cargando portafolio...</section>
    </main>

    <script src="/api-client.js"></script>
    <script>
      const menuToggle = document.getElementById('menuToggle');
      const navLinks = document.getElementById('navLinks');
      const portafolioContent = document.getElementById('portafolioContent');
      let modalesCreados = false;

      menuToggle?.addEventListener('click', () => navLinks?.classList.toggle('open'));

      function money(value) {
        return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(value);
      }

      function ensureModales() {
        if (modalesCreados) return;
        modalesCreados = true;
        document.body.insertAdjacentHTML('beforeend', `
          <div id="modalServicio" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:2000; align-items:center; justify-content:center;">
            <div style="background:#fff; width:min(560px,92%); border-radius:14px; padding:1.25rem; box-shadow:0 20px 40px rgba(0,0,0,.18);">
              <div style="display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1rem;">
                <h3 style="margin:0;">Agregar servicio</h3>
                <button type="button" id="cerrarServicio" style="background:none;border:none;font-size:20px;cursor:pointer;">✕</button>
              </div>
              <div style="display:grid; gap:.85rem;">
                <label class="field" style="display:grid; gap:.35rem;">
                  <span>Nombre</span>
                  <input id="servicioNombre" type="text" placeholder="Ej: Dirección de fotografía" />
                </label>
                <label class="field" style="display:grid; gap:.35rem;">
                  <span>Categoría</span>
                  <input id="servicioCategoria" type="text" placeholder="Ej: Técnica" />
                </label>
                <label class="field" style="display:grid; gap:.35rem;">
                  <span>Precio</span>
                  <input id="servicioPrecio" type="number" min="0" placeholder="Ej: 250000" />
                </label>
                <label class="field" style="display:grid; gap:.35rem;">
                  <span>Descripción</span>
                  <textarea id="servicioDescripcion" rows="4" placeholder="Describe el servicio"></textarea>
                </label>
                <div id="servicioStatus" style="font-size:13px;color:#6b7280;"></div>
                <div style="display:flex; gap:.75rem; justify-content:flex-end;">
                  <button type="button" id="cancelarServicio" class="btn btn-ghost">Cancelar</button>
                  <button type="button" id="guardarServicio" class="btn btn-primary">Guardar servicio</button>
                </div>
              </div>
            </div>
          </div>

          <div id="modalGaleria" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:2000; align-items:center; justify-content:center;">
            <div style="background:#fff; width:min(560px,92%); border-radius:14px; padding:1.25rem; box-shadow:0 20px 40px rgba(0,0,0,.18);">
              <div style="display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1rem;">
                <h3 style="margin:0;">Agregar foto al portafolio</h3>
                <button type="button" id="cerrarGaleria" style="background:none;border:none;font-size:20px;cursor:pointer;">✕</button>
              </div>
              <div style="display:grid; gap:.85rem;">
                <label class="field" style="display:grid; gap:.35rem;">
                  <span>Título</span>
                  <input id="galeriaTitulo" type="text" placeholder="Ej: Rodaje nocturno" />
                </label>
                <label class="field" style="display:grid; gap:.35rem;">
                  <span>Categoría</span>
                  <input id="galeriaCategoria" type="text" placeholder="Ej: Producción" />
                </label>
                <label class="field" style="display:grid; gap:.35rem;">
                  <span>Descripción</span>
                  <textarea id="galeriaDescripcion" rows="4" placeholder="Información breve de la foto"></textarea>
                </label>
                <label class="field" style="display:grid; gap:.35rem;">
                  <span>Imagen</span>
                  <input id="galeriaImagen" type="file" accept="image/*" />
                </label>
                <div id="galeriaStatus" style="font-size:13px;color:#6b7280;"></div>
                <div style="display:flex; gap:.75rem; justify-content:flex-end;">
                  <button type="button" id="cancelarGaleria" class="btn btn-ghost">Cancelar</button>
                  <button type="button" id="guardarGaleria" class="btn btn-primary">Guardar foto</button>
                </div>
              </div>
            </div>
          </div>
        `);
      }

      function openModal(id) {
        ensureModales();
        const modal = document.getElementById(id);
        if (modal) modal.style.display = 'flex';
      }

      function closeModal(id) {
        const modal = document.getElementById(id);
        if (modal) modal.style.display = 'none';
      }

      async function refreshPortafolio() {
        const data = await API_CLIENT.portal.proveedor.portafolio();
        renderPortafolio(data);
      }

      function renderPortafolio(data) {
        portafolioContent.innerHTML = `
          <div class="portal-breadcrumb">Panel de Proveedor > Portafolio</div>
          <div class="provider-header">
            <div>
              <h1>Portafolio</h1>
              <p>${data.rol || 'Proveedor'}</p>
              <small>${data.descripcion || ''}</small>
            </div>
            <div style="display:flex; gap:.75rem; flex-wrap:wrap;">
              <a class="btn btn-primary" href="#" id="btnAgregarServicio">+ Agregar servicio</a>
              <a class="btn btn-ghost" href="#" id="btnAgregarFoto">+ Agregar foto</a>
            </div>
          </div>

          <section class="portal-card">
            <h3>Servicios</h3>
            <div class="services-list">
              ${(data.servicios || []).map((s) => `
                <div style="display:grid; gap:.35rem;">
                  <span>${s.nombre}</span>
                  <small style="color:#6b7280;">${s.categoria || 'Sin categoría'}${s.descripcion ? ` · ${s.descripcion}` : ''}</small>
                  <strong>${money(s.precio || 0)}</strong>
                </div>
              `).join('')}
            </div>
          </section>

          <section class="portal-card">
            <h3>Galería de Trabajos</h3>
            <div class="provider-gallery">
              ${(data.galeria || []).map((item) => `
                <figure style="margin:0; background:#fff; border:1px solid #e5e7eb; border-radius:14px; overflow:hidden; box-shadow:0 6px 18px rgba(15,23,42,.06);">
                  <img src="${item.imagen}" alt="${item.titulo || 'Trabajo'}" style="width:100%; height:180px; object-fit:cover; display:block;" />
                  <figcaption style="padding:.85rem; display:grid; gap:.25rem;">
                    <strong>${item.titulo || 'Trabajo'}</strong>
                    <small style="color:#6b7280;">${item.categoria || 'Sin categoría'}</small>
                    <span style="font-size:13px; color:#374151;">${item.descripcion || ''}</span>
                  </figcaption>
                </figure>
              `).join('')}
            </div>
          </section>
        `;

        document.getElementById('btnAgregarServicio')?.addEventListener('click', (event) => {
          event.preventDefault();
          openModal('modalServicio');
        });

        document.getElementById('btnAgregarFoto')?.addEventListener('click', (event) => {
          event.preventDefault();
          openModal('modalGaleria');
        });
      }

      function wireModales() {
        ensureModales();
        document.getElementById('cerrarServicio')?.addEventListener('click', () => closeModal('modalServicio'));
        document.getElementById('cancelarServicio')?.addEventListener('click', () => closeModal('modalServicio'));
        document.getElementById('cerrarGaleria')?.addEventListener('click', () => closeModal('modalGaleria'));
        document.getElementById('cancelarGaleria')?.addEventListener('click', () => closeModal('modalGaleria'));

        document.getElementById('guardarServicio')?.addEventListener('click', async () => {
          const status = document.getElementById('servicioStatus');
          const nombre = document.getElementById('servicioNombre')?.value?.trim();
          const categoria = document.getElementById('servicioCategoria')?.value?.trim();
          const descripcion = document.getElementById('servicioDescripcion')?.value?.trim();
          const precio = document.getElementById('servicioPrecio')?.value;

          if (!nombre) {
            if (status) status.textContent = 'Debes escribir un nombre.';
            return;
          }

          try {
            if (status) status.textContent = 'Guardando...';
            await API_CLIENT.portal.proveedor.crearServicio({ nombre, categoria, descripcion, precio });
            closeModal('modalServicio');
            await refreshPortafolio();
          } catch (error) {
            if (status) status.textContent = error.message || 'No se pudo guardar el servicio.';
          }
        });

        document.getElementById('guardarGaleria')?.addEventListener('click', async () => {
          const status = document.getElementById('galeriaStatus');
          const titulo = document.getElementById('galeriaTitulo')?.value?.trim();
          const categoria = document.getElementById('galeriaCategoria')?.value?.trim();
          const descripcion = document.getElementById('galeriaDescripcion')?.value?.trim();
          const imagen = document.getElementById('galeriaImagen')?.files?.[0];

          if (!titulo || !imagen) {
            if (status) status.textContent = 'Debes escribir un título y seleccionar una imagen.';
            return;
          }

          try {
            if (status) status.textContent = 'Subiendo...';
            const formData = new FormData();
            formData.append('titulo', titulo);
            if (categoria) formData.append('categoria', categoria);
            if (descripcion) formData.append('descripcion', descripcion);
            formData.append('imagen', imagen);
            await API_CLIENT.portal.proveedor.crearGaleria(formData);
            closeModal('modalGaleria');
            await refreshPortafolio();
          } catch (error) {
            if (status) status.textContent = error.message || 'No se pudo guardar la foto.';
          }
        });
      }

      async function init() {
        try {
          const data = await API_CLIENT.portal.proveedor.portafolio();
          renderPortafolio(data);
          wireModales();
        } catch (error) {
          portafolioContent.innerHTML = `<article class="portal-card"><h1>No fue posible cargar el portafolio</h1><p>${error?.message || 'Intenta de nuevo más tarde.'}</p></article>`;
        }
      }

      init();
    </script>
    <script src='/nav-session.js'></script>
    <script src='/sidebar-slider.js'></script>
  </body>
</html>
